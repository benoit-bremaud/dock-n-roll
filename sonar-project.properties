# SonarQube project configuration — dock-n-roll
#
# Target: the shared self-hosted SonarQube Community Build at http://localhost:9000
# (sonarqube-stack repo). Analysis is local and manual — no CI job: the Community Build
# analyses one branch only, and the server has no public ingress.
#
# Usage: pnpm sonar   (runs the coverage, then the scan; token read from
#                      ~/.config/sonar-tokens/dock-n-roll — never hardcode it here)

sonar.projectKey=dock-n-roll
sonar.projectName=dock-n-roll
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx

# Same exclusions as the Vitest coverage gate (vitest.config.ts, ADR-0007): Electron
# composition roots are covered by the manual test of the built app; test helpers are not code.
sonar.coverage.exclusions=src/**/*.d.ts,src/main/index.ts,src/renderer/src/main.tsx,src/main/adapters/fake-docker-daemon.ts,src/main/domain/test-fixtures.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
