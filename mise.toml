# Local CI toolchain (#115, skill local-ci): every CLI the justfile tiers and the lefthook hooks call,
# pinned; `mise.lock` pins the checksums. `just setup` installs it. System tools stay outside mise:
# xvfb-run (the E2E smoke needs a display), docker (the smoke copes without it) and sonar-scanner
# (not in the mise registry, skill infra-accounts). Semgrep runs through `uvx` (justfile): a mise
# pipx install would need a mise-managed Python.
#
# Node and pnpm match .nvmrc / package.json#packageManager (electron-vite runs on Node 22; the app
# itself runs on the Node bundled by Electron), so the hooks run the project's own toolchain whether
# or not the shell activates mise.
[tools]
node = "22.23.4"
pnpm = "10.30.3"
uv = "0.13.7"            # `uvx semgrep@…`
just = "1.59.0"
lefthook = "2.2.2"
typos = "1.52.2"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
trufflehog = "3.99.8"
trivy = "0.76.2"         # nightly: known CVEs in the lockfile

[env]
# The standalone pnpm binary ships its own CA bundle and refuses the certificate the Aikido
# safe-chain proxy presents for registry.npmjs.org (`pnpm audit`, `pnpm install`); the system
# bundle holds that CA (skill aikido-device-protection).
NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

[settings]
lockfile = true
