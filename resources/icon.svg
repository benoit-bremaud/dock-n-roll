<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Application icon (#47): the tray icon's ring and dot on a rounded tile.
       Colours from tokens.css: dark background, ink, and the status "on" green for the dot
       (the tray stays monochrome for the top bar). Export, one per size in resources/icons/:
       inkscape resources/icon.svg -w N -h N -o resources/icons/NxN.png -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="#0d1117"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="#e6edf3" stroke-width="40"/>
  <circle cx="256" cy="256" r="64" fill="#3fb950"/>
</svg>
