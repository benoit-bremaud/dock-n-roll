# typos configuration (#115, `just lint` and the pre-commit hook). Everything written here is
# English; the exclusions are generated or third-party content.
[files]
extend-exclude = [
  "coverage/",
  "dist/",
  "out/",
  "pnpm-lock.yaml",
  "*.lock",
  "*.png",
  "*.svg",
]

[default]
extend-ignore-re = [
  "\\b[0-9a-f]{7,40}\\b", # commit SHAs and digests
  "\\bPVT[A-Z_]*_[A-Za-z0-9]+\\b", # GitHub Projects v2 node ids
]

# Real Compose project names quoted as test data and in the log (French), not misspellings.
[default.extend-words]
projet = "projet"
bulle = "bulle"
